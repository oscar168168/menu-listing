# Firebase App Hosting configuration (Cloud Run + Cloud Build)
# Docs: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 20
  concurrency: 80

env:
  # Firebase project ID for Cloud Firestore (uses Application Default Credentials automatically on Cloud Run)
  - variable: FIREBASE_PROJECT_ID
    value: menu-listing
    availability:
      - BUILD
      - RUNTIME

  # Random 64-char HMAC secret for signed session cookies:
  #   npx -y firebase-tools@latest apphosting:secrets:set AUTH_SECRET --project menu-listing
  - variable: AUTH_SECRET
    secret: AUTH_SECRET
    availability:
      - RUNTIME

  # Replace with your deployed App Hosting URL or custom domain (used in QR code links)
  - variable: NEXT_PUBLIC_APP_URL
    value: https://your-backend.hosted.app
    availability:
      - BUILD
      - RUNTIME

  # Optional: Firebase Storage bucket name (e.g. menu-listing.firebasestorage.app)
  # When set, /api/upload persists dish photos & logos in Firebase Storage instead of local disk.
  # - variable: FIREBASE_STORAGE_BUCKET
  #   value: menu-listing.firebasestorage.app
  #   availability:
  #     - RUNTIME
